name: Deploy Next.js to GitHub Pages (No Code Changes)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies (Cross-Platform)
        # --- SECCIÓN MODIFICADA ---
        # Este método es más robusto para manejar diferencias de plataforma.
        # 1. Eliminamos el package-lock.json generado en Windows.
        # 2. Usamos 'npm install' para generar uno nuevo compatible con Linux.
        run: |
          echo "Removing platform-specific package-lock.json..."
          rm -f package-lock.json
          echo "Installing dependencies and generating new lockfile for Linux..."
          npm install

      - name: Create temporary next.config.js for static export
        run: |
          cat <<'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            basePath: '/ventasya-internacional/',
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          }
          module.exports = nextConfig
          EOF

      - name: Build Static Export
        run: npm run build
        
      - name: List 'out' directory (for debugging)
        run: ls -la out/
        
      - name: Prepare deployment files
        run: |
          mkdir -p deploy-files
          cp -r out/* deploy-files/
          touch deploy-files/.nojekyll
          cp deploy-files/index.html deploy-files/404.html
          echo "Files ready for deployment:"
          ls -la deploy-files/
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-files
          branch: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          clean: true
