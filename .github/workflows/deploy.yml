name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          # ELIMINADO: cache: 'npm'
          # Razón: El caché está guardando binarios de Windows y causando el error EBADPLATFORM.
          
      - name: Install dependencies (Clean Slate Method)
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          
          echo "Cleaning npm cache thoroughly..."
          npm cache clean --force
          
          echo "Removing any existing package-lock.json and node_modules..."
          rm -rf package-lock.json node_modules
          
          echo "Installing dependencies for Linux platform..."
          # Al eliminar el cache y el lock, npm descargará los binarios correctos para Linux (linux-x64)
          npm install

      - name: Create temporary next.config.js for static export
        run: |
          cat <<'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            # ¡IMPORTANTE! Reemplaza 'ventasya-internacional' con el nombre de tu repositorio
            basePath: '/ventasya-internacional/', 
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          }
          module.exports = nextConfig
          EOF

      - name: Build Static Export
        run: npm run build
        
      - name: List 'out' directory (for debugging)
        run: ls -la out/
        
      - name: Prepare deployment files
        run: |
          mkdir -p deploy-files
          cp -r out/* deploy-files/
          touch deploy-files/.nojekyll
          cp deploy-files/index.html deploy-files/404.html
          echo "Files ready for deployment:"
          ls -la deploy-files/
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-files
          branch: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          clean: true
