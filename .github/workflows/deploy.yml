name: Deploy Next.js to GitHub Pages (No Code Changes)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm' # Mantenemos el caché, pero lo limpiaremos explícitamente
          
      - name: Install dependencies (Clean Slate Method)
        # --- SECCIÓN COMPLETAMENTE REESCRITA ---
        # Este método realiza una limpieza total para evitar cualquier residuo de plataforma.
        run: |
          echo "Node version:"
          node -v
          echo "NPM version:"
          npm -v
          
          echo "Checking for problematic .npmrc file..."
          # Listamos el archivo .npmrc si existe para depurar
          ls -la .npmrc || echo "No .npmrc file found in project root."
          
          echo "Cleaning npm cache thoroughly..."
          # Limpiamos el caché de npm de forma forzada
          npm cache clean --force
          
          echo "Removing any existing package-lock.json and node_modules..."
          # Nos aseguramos de eliminar cualquier rastro de instalaciones previas
          rm -rf package-lock.json node_modules
          
          echo "Installing dependencies from scratch for Linux platform..."
          # Ahora, la instalación debería ser 100% limpia y para la plataforma correcta
          npm install

      - name: Create temporary next.config.js for static export
        run: |
          cat <<'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            # ¡IMPORTANTE! Reemplaza 'ventasya-internacional' con el nombre de tu repositorio
            basePath: '/ventasya-internacional/', 
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          }
          module.exports = nextConfig
          EOF

      - name: Build Static Export
        run: npm run build
        
      - name: List 'out' directory (for debugging)
        run: ls -la out/
        
      - name: Prepare deployment files
        run: |
          mkdir -p deploy-files
          cp -r out/* deploy-files/
          touch deploy-files/.nojekyll
          cp deploy-files/index.html deploy-files/404.html
          echo "Files ready for deployment:"
          ls -la deploy-files/
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-files
          branch: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          clean: true
