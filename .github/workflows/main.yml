name: Deploy Next.js App to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        # El comando de build para Next.js es 'npm run build'. La configuración de exportación estática y el basePath se definen en next.config.js
        run: npm run build
        
      - name: List 'out' directory (for debugging)
        # Next.js genera la carpeta 'out' para exportaciones estáticas
        run: ls -la out/
        
      - name: Prepare deployment files
        run: |
          # Crear carpeta temporal para los archivos de despliegue
          mkdir -p deploy-files
          
          # Copiar los archivos de la build (desde la carpeta 'out') a la carpeta de despliegue
          cp -r out/* deploy-files/
          
          # Crear archivo .nojekyll para evitar que GitHub Pages procese los archivos con Jekyll
          touch deploy-files/.nojekyll
          
          # Crear archivo 404.html para que el routing de Next.js funcione correctamente
          cp deploy-files/index.html deploy-files/404.html
          
          # Listar archivos para verificar
          echo "Files ready for deployment:"
          ls -la deploy-files/
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-files
          branch: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          clean: true
