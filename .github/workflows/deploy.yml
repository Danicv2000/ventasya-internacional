name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          # IMPORTANTE: Mantener cache deshabilitado para evitar conflictos de plataforma
          
      - name: Install dependencies (Safe & Automatic Method)
        run: |
          echo "Node version:"
          node -v
          
          echo "Cleaning environment..."
          # Limpiamos cualquier residuo que pueda causar conflicto
          rm -rf node_modules package-lock.json
          
          echo "Installing dependencies..."
          # 'npm install' creará un package-lock.json nuevo si falta (arregla el error actual)
          # y detectará automáticamente que estamos en Linux (arregla el error anterior de Windows)
          npm install

      - name: Create temporary next.config.js for static export
        run: |
          cat <<'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            # ¡IMPORTANTE! Asegúrate de que este nombre coincida con tu repo
            basePath: '/ventasya-internacional/', 
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          }
          module.exports = nextConfig
          EOF

      - name: Build Static Export
        run: npm run build
        
      - name: List 'out' directory (for debugging)
        run: ls -la out/
        
      - name: Prepare deployment files
        run: |
          mkdir -p deploy-files
          cp -r out/* deploy-files/
          touch deploy-files/.nojekyll
          cp deploy-files/index.html deploy-files/404.html
          echo "Files ready for deployment:"
          ls -la deploy-files/
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-files
          branch: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          clean: true
